name: MasterKey Post-Quantum Protocol CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-post-quantum-protocol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: masterkey-web5-protocol
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: masterkey-web5-protocol/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build All Post-Quantum Packages
        run: npm run build

      - name: Run Cryptographic & Governance Security Suite
        run: npm test
