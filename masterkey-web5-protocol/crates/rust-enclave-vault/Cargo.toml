[package]
name = "masterkey-rust-enclave"
version = "1.0.0"
edition = "2021"

[dependencies]
chacha20poly1305 = "0.10"
sha3 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"

[profile.release]
strip = true        # Strips all function names and symbols from the compiled binary
opt-level = "z"     # Optimizes binary size and obfuscates layout
lto = true          # Link-Time Optimization for hardened machine code
codegen-units = 1
